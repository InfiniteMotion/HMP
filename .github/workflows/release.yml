name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desktop-macos:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: macos-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build macOS DMG
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS --no-daemon --rerun-tasks --no-configuration-cache

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: desktop/app/build/compose/binaries/main/dmg/

  desktop-windows:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: windows-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Build Windows MSI
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS --no-daemon --rerun-tasks --no-configuration-cache

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/app/build/compose/binaries/main/msi/

  desktop-linux:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    env:
      HMP_BUILD_TARGET: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot

      - name: Build Linux DEB + AppImage
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS --no-daemon --rerun-tasks --no-configuration-cache

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/app/build/compose/binaries/main/deb/
            desktop/app/build/compose/binaries/main/appimage/

  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    needs: [desktop-macos, desktop-windows, desktop-linux]
    runs-on: ubuntu-latest
    env:
      HMP_BUILD_TARGET: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from gradle.properties
        id: version
        run: |
          VERSION=$(grep '^hmp.versionName=' gradle.properties | cut -d'=' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/hmp-unified-key.jks

      - name: Inject built-in AI API key
        run: |
          echo "BUILT_IN_AI_API_KEY=${{ secrets.BUILT_IN_AI_API_KEY }}" >> gradle.properties

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts/

      - name: Build Android Release
        run: ./gradlew :android:app:assembleRelease :android:app:bundleRelease --no-daemon --no-configuration-cache
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename build outputs
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cp android/app/build/outputs/apk/release/app-release.apk "HMP-v${VERSION}-release.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "HMP-v${VERSION}-release.aab"

          # Rename desktop artifacts
          for dmg in desktop-artifacts/desktop-macos/*.dmg; do
            [ -f "$dmg" ] && cp "$dmg" "HMP-v${VERSION}-macos.dmg"
          done
          for msi in desktop-artifacts/desktop-windows/*.msi; do
            [ -f "$msi" ] && cp "$msi" "HMP-v${VERSION}-windows.msi"
          done
          deb_file=$(find desktop-artifacts/desktop-linux -name "*.deb" 2>/dev/null | head -1)
          if [ -n "$deb_file" ]; then cp "$deb_file" "HMP-v${VERSION}-linux.deb"; fi
          appimage_file=$(find desktop-artifacts/desktop-linux -name "*.AppImage" 2>/dev/null | head -1)
          if [ -n "$appimage_file" ]; then cp "$appimage_file" "HMP-v${VERSION}-linux.AppImage"; fi

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-v:refname | head -1)
          echo "TAG=$PREV" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=${{ steps.prev_tag.outputs.TAG }}
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            NOTES="- Initial release"
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          # Collect all release assets
          ASSETS=(
            HMP-v${VERSION}-release.apk
            HMP-v${VERSION}-release.aab
          )
          [ -f "HMP-v${VERSION}-macos.dmg" ] && ASSETS+=("HMP-v${VERSION}-macos.dmg")
          [ -f "HMP-v${VERSION}-windows.msi" ] && ASSETS+=("HMP-v${VERSION}-windows.msi")
          [ -f "HMP-v${VERSION}-linux.deb" ] && ASSETS+=("HMP-v${VERSION}-linux.deb")
          [ -f "HMP-v${VERSION}-linux.AppImage" ] && ASSETS+=("HMP-v${VERSION}-linux.AppImage")

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "## ${TAG}

          ${{ steps.notes.outputs.NOTES }}

          ---
          ### Assets
          - **Android**: \`HMP-v${VERSION}-release.apk\` / \`HMP-v${VERSION}-release.aab\` (Google Play)
          - **macOS**: \`HMP-v${VERSION}-macos.dmg\`
          - **Windows**: \`HMP-v${VERSION}-windows.msi\`
          - **Linux**: \`HMP-v${VERSION}-linux.deb\` / \`HMP-v${VERSION}-linux.AppImage\`" \
            "${ASSETS[@]}"

  deploy-site:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

